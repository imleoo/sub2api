# 简化版 GoReleaser 配置 - 仅发布 x86_64 GHCR 镜像
version: 2

project_name: tokenpanel

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: tokenpanel
    dir: backend
    main: ./cmd/server
    binary: tokenpanel
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

# 跳过 archives
archives: []

# 跳过 checksum
checksum:
  disable: true

changelog:
  disable: true

# 仅 GHCR x86_64 镜像
dockers:
  - id: ghcr-amd64
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenpanel:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenpanel:{{ .Version }}"
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenpanel:latest"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    extra_files:
      - deploy/docker-entrypoint.sh
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

# 跳过 manifests（单架构不需要）
docker_manifests: []

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  name_template: "TokenPanel {{.Version}} (Simple)"
  # 跳过上传二进制包
  skip_upload: true
  header: |
    > AI API Gateway Platform - 将 AI 订阅配额分发和管理
    > ⚡ Simple Release: 仅包含 x86_64 GHCR 镜像

    {{ .Env.TAG_MESSAGE }}

  footer: |
    ---

    ## 📥 安装指南 / Installation Guide

    ### 方式一：Docker Compose（推荐，含内置 PostgreSQL + Redis）

    适合全新安装，数据库和缓存由 Compose 自动管理。

    ```bash
    # 1. 下载部署文件
    mkdir tokenpanel && cd tokenpanel
    curl -sSLO https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/zhiguofan/deploy/docker-compose.yml
    curl -sSLO https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/zhiguofan/deploy/.env.example

    # 2. 配置环境变量
    cp .env.example .env
    nano .env   # 至少填写必填项（见下方说明）

    # 3. 启动服务（首次运行自动初始化数据库）
    docker compose up -d
    docker compose logs -f tokenpanel
    ```

    ### 方式二：外部数据库（Standalone）

    **前提条件（必须提前准备好）：**
    - PostgreSQL 18+，已创建数据库和用户
    - Redis 8+，可选设置密码

    ```bash
    mkdir tokenpanel && cd tokenpanel
    curl -sSLO https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/zhiguofan/deploy/docker-compose.standalone.yml
    curl -sSLO https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/zhiguofan/deploy/.env.example
    cp .env.example .env && nano .env
    docker compose -f docker-compose.standalone.yml up -d
    ```

    ---

    ## ⚙️ .env 关键配置说明

    ### 必填项

    | 变量 | 说明 |
    |------|------|
    | `POSTGRES_PASSWORD` | PostgreSQL 密码（方式一）|
    | `DATABASE_HOST` / `DATABASE_PASSWORD` | 外部 PG 连接信息（方式二）|
    | `REDIS_HOST` | 外部 Redis 主机（方式二）|

    ### 强烈建议设置（避免重启后失效）

    ```bash
    openssl rand -hex 32   # 生成随机密钥
    ```

    | 变量 | 若留空的后果 |
    |------|------------|
    | `JWT_SECRET` | 容器重启后所有用户被强制登出 |
    | `TOTP_ENCRYPTION_KEY` | 重启后所有 2FA 配置失效 |

    ### 管理员账号

    | 变量 | 默认值 |
    |------|--------|
    | `ADMIN_EMAIL` | `admin@tokenpanel.local` |
    | `ADMIN_PASSWORD` | 留空则自动生成，见启动日志 |

    ---

    ## 🔄 升级

    ```bash
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/tokenpanel:{{ .Version }}
    docker compose pull && docker compose up -d
    # 数据库迁移自动执行，查看日志确认
    docker compose logs -f tokenpanel
    ```

    ## 📚 文档

    - [GitHub 仓库](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
    - [.env 完整配置参考](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/blob/zhiguofan/deploy/.env.example)
